<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel de Triagem • Fala Dodói</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina-login">

        <section class="card-login">

            <div class="titi-login-area">
                <img src="../assets/titi/login/titi-login-sem-fundo.png" alt="Titi saudando o profissional"
                    class="titi-login-img">
            </div>

            <div class="logo-area">
                <h1> Painel de Triagem</h1>

                <p>
                    Acesso exclusivo para profissionais
                </p>
            </div>

            <form class="form-login" id="form-login">

                <div class="linha-inputs">

                    <div class="grupo-input">
                        <label for="usuario">
                            Usuário
                        </label>

                        <input type="text" id="usuario" placeholder="Digite seu usuário" required>
                    </div>

                    <div class="grupo-input">
                        <label for="senha">
                            Senha
                        </label>

                        <input type="password" id="senha" placeholder="Digite sua senha" required>
                    </div>
                </div>

                    <button type="submit" class="btn-login">
                        Entrar no sistema
                    </button>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
