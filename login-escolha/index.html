<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escolha de Acesso • Fala Dodói</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="pagina-escolha">

    <section class="card-escolha">

      <div class="topo-escolha">
        <img
          src="../assets/titi/login/titi-login-sem-fundo.png"
          alt="Titi saudando"
          class="titi-escolha"
        >

        <h1>Fala Dodói</h1>

        <p>
          Escolha qual área deseja acessar
        </p>
      </div>

      <div class="opcoes-acesso">

        <button class="card-opcao" id="btn-triagem" type="button">
          <span class="icone-opcao">🩺</span>

          <strong>Triagem</strong>

          <small>
            Acesso para avaliação inicial do paciente
          </small>
        </button>

        <button class="card-opcao comissao" id="btn-comissao" type="button">
          <span class="icone-opcao">🚨</span>

          <strong>Comissão de Dor</strong>

          <small>
            Acesso para alertas e acompanhamento clínico
          </small>
        </button>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
