<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comissão de Dor • Fala Dodói</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="pagina-login">

    <section class="card-login">

      <div class="titi-login-area">
        <img
          src="../assets/titi/login/titi-login-sem-fundo.png"
          alt="Titi saudando"
          class="titi-login-img"
        >
      </div>

      <div class="logo-area">
        <h1>Comissão de Dor</h1>

        <p>
          Acesso reservado para monitoramento e alertas clínicos
        </p>
      </div>

      <form class="form-login" id="form-login">

        <div class="linha-inputs">

          <div class="grupo-input">
            <label for="usuario">
              Usuário
            </label>

            <input
              type="text"
              id="usuario"
              placeholder="Digite o usuário"
              required
            >
          </div>

          <div class="grupo-input">
            <label for="senha">
              Senha
            </label>

            <input
              type="password"
              id="senha"
              placeholder="Digite a senha"
              required
            >
          </div>

        </div>

        <button type="submit" class="btn-login">
          Acessar Painel
        </button>

      </form>

    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
