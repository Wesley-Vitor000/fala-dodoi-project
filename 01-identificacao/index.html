<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identificação do Paciente</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="pagina">
    <section class="card-identificacao">
      <div class="topo">
        <h1>Fala Dodói</h1>
        <p>Identificando a dor quando as palavras não existem</p>
        
        <p class="subtitulo">
          Preencha os dados do paciente para iniciar a avaliação
        </p>
      </div>

      <form id="form-identificacao" class="formulario">
        <div class="grupo-campo">
          <label for="nome">Nome completo</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite o nome do paciente"
            required
          >
        </div>

        <div class="grupo-campo">
          <label for="sexo">Sexo</label>
          <select id="sexo" name="sexo" required>
            <option value="">Selecione</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
          </select>
        </div>

        <div class="grupo-campo">
          <label for="idade">Idade</label>
          <input
            type="number"
            id="idade"
            name="idade"
            placeholder="Digite a idade"
            min="0"
            required
          >
        </div>

        <div class="grupo-campo">
          <label for="prontuario">Prontuário</label>
          <input
            type="text"
            id="prontuario"
            name="prontuario"
            placeholder="Digite o número do prontuário"
          >
        </div>

        <div class="acoes">
          <button type="submit" id="btn-proximo" class="btn-principal">
            Próximo
          </button>
        </div>
      </form>

      <div id="mensagem" class="mensagem" aria-live="polite"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
